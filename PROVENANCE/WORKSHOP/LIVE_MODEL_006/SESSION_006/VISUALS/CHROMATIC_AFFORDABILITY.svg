<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">MK163 Chromatic District Affordability</title><desc id="desc">Qualitative, not-to-scale profile of increasing housing and amenity costs from Red to Violet, with the largest jump from Yellow to Green and a further premium from Blue to Violet.</desc><rect width="900" height="460" fill="#121923"/><text x="50" y="52" fill="#fff" font-size="27" font-family="Arial" font-weight="bold">Chromatic district affordability</text><text x="50" y="82" fill="#b9c5d2" font-size="17" font-family="Arial">Illustrative progression · no numeric price ratios established</text><path d="M95 125 V365 H850" fill="none" stroke="#9aa7b7" stroke-width="2"/><text x="27" y="170" fill="#b9c5d2" font-size="14" font-family="Arial">Higher</text><text x="27" y="188" fill="#b9c5d2" font-size="14" font-family="Arial">cost</text><polyline points="125,344 265,326 405,301 545,215 685,185 825,128" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/><g font-family="Arial" font-size="17" font-weight="bold" text-anchor="middle"><circle cx="125" cy="344" r="10" fill="#C83E43"/><text x="125" y="399" fill="#C83E43">RED</text><circle cx="265" cy="326" r="10" fill="#E98B35"/><text x="265" y="399" fill="#E98B35">ORANGE</text><circle cx="405" cy="301" r="10" fill="#E8C743"/><text x="405" y="399" fill="#E8C743">YELLOW</text><circle cx="545" cy="215" r="10" fill="#4FA66B"/><text x="545" y="399" fill="#4FA66B">GREEN</text><circle cx="685" cy="185" r="10" fill="#448DCD"/><text x="685" y="399" fill="#448DCD">BLUE</text><circle cx="825" cy="128" r="10" fill="#875AC0"/><text x="825" y="399" fill="#bba0e8">VIOLET</text></g><path d="M475 190 L480 260" stroke="#e8c743" stroke-width="2" stroke-dasharray="5 5"/><text x="415" y="168" fill="#e8c743" font-size="17" font-family="Arial">Major threshold</text><text x="50" y="440" fill="#b9c5d2" font-size="14" font-family="Arial">White is the civic center, not a residential affordability tier. Districts are clean and maintained throughout.</text></svg>
